function fieldHTML(f){

function compress(file,cb){
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=900,sc=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.72))};im.onerror=()=>setStatus('No se pudo leer esa imagen.');im.src=r.result};r.readAsDataURL(file)}
function bind(){
  document.querySelectorAll('#step input[type=text],#step textarea').forEach(el=>{

    el.addEventListener('input',()=>setA(k,el.value))});
  document.querySelectorAll('#step .chips').forEach(g=>{

    g.querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{
      if(i.type==='radio'){setA(k,i.value)}else{const arr=[];g.querySelectorAll('input:checked').forEach(x=>arr.push(x.value));setA(k,arr)}
      g.querySelectorAll('label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked))}))});

}

}
function fname(){return 'Evidencia_'+CONFIG.id+'_'+(S.student||'sin-nombre').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')+'.html'}
function need(){if(!(S.student||'').trim()){const e=$('err');e.style.display='block';e.textContent='Escribe tu nombre al inicio de la página antes de guardar la evidencia.';window.scrollTo(0,0);setStatus('Falta tu nombre.');return false}const e=$('err');if(e)e.style.display='none';return true}
function doDownload(){if(!need())return;const blob=new Blob([evidenceHTML()],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);setStatus('Evidencia descargada: '+fname()+'. Revisa tu carpeta de descargas y envíala a tu profesor.')}
function summaryText(){let o='Estudiante: '+S.student+'\nCurso: '+S.course+'\nActividad: '+CONFIG.title+'\nFecha: '+fmt(new Date())+'\n';
  CONFIG.steps.forEach(s=>{o+='\n== '+s.title+' ==\n';s.fields.forEach(f=>{if(f.t==='photo'){o+=f.l+': '+(S.p[f.k]?'(foto en el archivo adjunto)':'(sin foto)')+'\n';return}let v=S.a[f.k];if(Array.isArray(v))v=v.join(', ');o+=f.l+': '+(v||'(sin respuesta)')+'\n'})});
  o+='\n== Cierre ==\nHoy aprendí que '+(S.a.c1||'-')+'; lo descubrí al '+(S.a.c2||'-')+'; me sirve para '+(S.a.c3||'-')+'.\nPregunta central: '+(S.a.central||'-')+'\n'+CONFIG.meta+': '+(S.a.meta||'-')+'\n';return o}
function doEmail(){if(!need())return;doDownload();
  const to=CONFIG.email,subj='Evidencia salida MUG · '+S.course+' · '+S.student;
  let body=summaryText()+'\n(Adjunto mi archivo de evidencia con fotos: '+fname()+')';
  const mk=b=>'mailto:'+to+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(b);
  while(mk(body).length>1900&&body.length>200){body=body.slice(0,body.length-150)}
  if(body.length<summaryText().length)body+='\n[...resumen recortado: el detalle completo está en el archivo adjunto]';
  setTimeout(()=>{window.location.href=mk(body)},700);
  setStatus('Se descargó tu archivo '+fname()+'. En tu correo, ADJUNTA ese archivo antes de enviar.')}
function doShare(){if(!need())return;const file=new File([evidenceHTML()],fname(),{type:'text/html'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Evidencia '+CONFIG.title,text:'Evidencia de '+S.student+' · '+S.course}).then(()=>setStatus('Compartido.')).catch(()=>setStatus('Compartir cancelado.'))}
  else{doDownload();setStatus('Tu navegador no permite compartir directo. Se descargó el archivo: envíalo por WhatsApp o correo.')}}
function doPdf(){if(!need())return;const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);f.srcdoc=evidenceHTML();f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){setStatus('No se pudo abrir la impresión. Usa "Descargar evidencia".')}setTimeout(()=>f.remove(),60000)};setStatus('En la ventana de impresión elige "Guardar como PDF".')}
render();
